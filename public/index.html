<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Notes - B.Tech Notes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #172033;
    }

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 23px;
      font-weight: 700;
    }

    .login-btn {
      border: 0;
      background: #172033;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .hero p {
      color: #667085;
      font-size: 17px;
      margin-bottom: 28px;
    }

    .search {
      width: min(650px, 92%);
      padding: 16px 20px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: 45px auto;
    }

    .section-title {
      margin-bottom: 22px;
      font-size: 26px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .card-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .features {
      margin-top: 50px;
    }

    .feature {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .feature h3 {
      margin-bottom: 6px;
    }

    .feature p {
      color: #667085;
    }

    footer {
      margin-top: 80px;
      padding: 30px;
      text-align: center;
      background: #172033;
      color: white;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 55px 15px;
      }

      .hero h1 {
        font-size: 31px;
      }

      nav {
        padding: 15px 5%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">📚 Study Notes</div>
    <button class="login-btn">Login</button>
  </nav>

  <section class="hero">
    <h1>Study Smarter</h1>
    <p>Find B.Tech notes, subjects and study material in one place.</p>

    <input
      class="search"
      type="search"
      placeholder="Search notes, subjects or courses..."
      id="searchBox"
    >
  </section>

  <main class="container">

    <h2 class="section-title">Popular Degrees</h2>

    <div class="cards">

      <div class="card">
        <div class="card-icon">🎓</div>
        <h3>B.Tech</h3>
        <p>Engineering courses, subjects and study notes.</p>
      </div>

      <div class="card">
        <div class="card-icon">💻</div>
        <h3>Computer Science</h3>
        <p>
