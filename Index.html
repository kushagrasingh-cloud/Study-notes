<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Notes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #172033;
    }

    nav {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .login {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #667085;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .search {
      width: min(650px, 90%);
      padding: 16px 20px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: 50px auto;
    }

    .container h2 {
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #667085;
      font-size: 14px;
    }

    footer {
      margin-top: 80px;
      padding: 30px;
      text-align: center;
      background: #172033;
      color: white;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      nav {
        padding: 15px 5%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">📚 Study Notes</div>
    <button class="login">Login</button>
  </nav>

  <section class="hero">
    <h1>Study Smarter with Study Notes</h1>
    <p>Find notes, subjects and study material in one place.</p>

    <input
      class="search"
      type="text"
      placeholder="Search notes, subjects or courses..."
    >
  </section>

  <main class="container">

    <h2>Popular Degrees</h2>

    <div class="cards">

      <div class="card">
        <h3>B.Tech</h3>
        <p>Computer Science and Engineering</p>
      </div>

      <div class="card">
        <h3>BCA</h3>
        <p>Computer Applications</p>
      </div>

      <div class="card">
        <h3>B.Sc</h3>
        <p>Science courses and notes</p>
      </div>

      <div class="card">
        <h3>B.Com</h3>
        <p>Commerce courses and notes</p>
      </div>

    </div>

  </main>

  <footer>
    © 2026 Study Notes. All rights reserved.
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
